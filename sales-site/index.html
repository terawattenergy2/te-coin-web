<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM | Terawatt</title>
<link rel="stylesheet" href="/site.css">
<script type="module" src="/site.js"></script>
</head>
<body>
<header><strong>CRM</strong><button id="logout" hidden>ออกจากระบบ</button></header>
<main>
<h1>ยอดขายตามเซลส์</h1>
<form id="login" hidden>
<p>เข้าสู่ระบบด้วยบัญชีผู้ดูแล TeraCoin</p>
<label>อีเมล<input id="email" type="email" autocomplete="username" required></label>
<label>รหัสผ่าน<input id="password" type="password" autocomplete="current-password" required></label>
<button type="submit">เข้าสู่ระบบ</button>
</form>
<section id="report" hidden aria-label="รายงานยอดขาย">
<div class="toolbar"><button id="refresh">ดึงข้อมูลล่าสุด</button><span>อัปเดตอัตโนมัติทุกวันช่วง 03:00–03:59 น. เวลาไทย</span></div>
<iframe id="frame" title="รายงานยอดขายแยกตามเซลส์และสินค้า" sandbox="allow-scripts allow-downloads" hidden></iframe>
</section>
<p id="status" role="status">กำลังเปิดรายงาน…</p>
</main>
</body>
</html>
